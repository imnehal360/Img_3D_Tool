<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Im3D — Examples</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Space+Grotesk:wght@400;500;600&display=swap');

        :root {
            --bg: #0d1113;
            --panel: #12171a;
            --line: #283034;
            --ink: #eef1f0;
            --dim: #9aa5a3;
            --accent: #ff8a3d;
            --green: #6bd3a3
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif
        }

        .wrap {
            max-width: 1280px;
            margin: auto;
            padding: 0 28px
        }

        header {
            border-bottom: 1px solid var(--line);
            padding: 34px 0 28px
        }

        header .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .brand {
            font: 600 32px Fraunces, serif
        }

        .brand i {
            color: var(--accent)
        }

        .back {
            color: var(--dim);
            font-size: 13px;
            text-decoration: none
        }

        main {
            padding: 46px 0 80px
        }

        .intro {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px
        }

        .intro h1 {
            font: 500 42px Fraunces, serif;
            margin: 0
        }

        .intro p {
            max-width: 420px;
            color: var(--dim);
            font-size: 14px;
            line-height: 1.55
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            border: 1px solid var(--line);
            padding: 12px 14px;
            margin-bottom: 14px;
            background: var(--panel)
        }

        .case-list {
            display: flex;
            gap: 8px;
            overflow: auto
        }

        .case-btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--dim);
            padding: 8px 12px;
            cursor: pointer
        }

        .case-btn.active {
            border-color: var(--accent);
            color: var(--ink)
        }

        .count {
            color: var(--dim);
            font-size: 12px
        }

        .compare {
            display: grid;
            grid-template-columns: 1.05fr 1fr 1fr;
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line)
        }

        .pane {
            background: var(--panel)
        }

        .pane-head {
            display: flex;
            justify-content: space-between;
            padding: 15px 17px;
            border-bottom: 1px solid var(--line);
            font-size: 12px;
            text-transform: uppercase
        }

        .tag {
            color: var(--accent);
            font-size: 11px
        }

        .input-wrap,
        .model-wrap {
            height: 480px;
            position: relative;
            background: #0a0d0f
        }

        .input-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain
        }

        .meshy-shot {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            padding: 28px;
        }

        .model-wrap model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: #101517
        }

        .hint {
            position: absolute;
            bottom: 12px;
            left: 14px;
            color: var(--dim);
            font-size: 11px;
            pointer-events: none
        }

        .empty,
        .notice {
            padding: 38px;
            text-align: center;
            color: var(--dim);
            font-size: 13px;
            line-height: 1.5
        }

        .empty {
            height: 100%;
            display: grid;
            place-items: center
        }

        .empty strong,
        .notice strong {
            display: block;
            color: var(--ink);
            font: 24px Fraunces, serif;
            margin-bottom: 8px
        }

        .details {
            grid-column: 1/-1;
            display: flex;
            justify-content: space-between;
            gap: 18px;
            border-top: 1px solid var(--line);
            padding: 16px;
            background: var(--panel)
        }

        .title {
            font: 500 20px Fraunces, serif;
            margin: 0 0 5px
        }

        .sub {
            color: var(--dim);
            font-size: 12px;
            margin: 0
        }

        .metrics {
            display: flex;
            gap: 18px;
            color: var(--dim);
            font-size: 11px;
            text-align: right
        }

        .metrics b {
            display: block;
            color: var(--ink);
            font-size: 14px;
            margin-top: 4px
        }

        @media(max-width:900px) {
            .compare {
                grid-template-columns: 1fr
            }

            .input-wrap,
            .model-wrap {
                height: 360px
            }

            .intro {
                display: block
            }

            .details {
                grid-column: auto;
                display: block
            }

            .metrics {
                text-align: left;
                margin-top: 16px
            }
        }
    .upload-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#1a100a;padding:9px 12px;font-size:12px;cursor:pointer;border-radius:3px;font-weight:600}.upload-btn input{display:none}.upload-note{color:var(--dim);font-size:11px;margin:8px 0 0}.upload-status{color:var(--accent);font-size:11px;margin:8px 0 0}</style>
</head>

<body>
    <header>
        <div class="wrap">
            <div class="brand">Im3D<i>.</i></div><a class="back" href="index.html">← Back to generator</a>
        </div>
    </header>
    <main>
        <div class="wrap">
            <div class="intro">
                <div>
                    <p style="color:var(--accent);font-size:11px;letter-spacing:.12em;text-transform:uppercase">
                        BENCHMARK GALLERY</p>
                    <h1>Examples, side by side.</h1>
                </div>
                <p>Inspect the same input beside Meshy and your own reconstruction. Orbit either model, zoom in, and
                    compare shape, scale, and color at your own pace.</p>
            </div>
            <div class="toolbar">
                <div class="case-list" id="case-list"></div><span class="count" id="count">Loading…</span>
            </div>
            <section id="comparison" class="notice"><strong>Loading examples</strong>Looking for generated outputs from
                the backend…</section>
        </div>
    </main>
    <script>
const API_BASE = window.API_BASE || window.location.origin;
const list = document.getElementById('case-list');
const count = document.getElementById('count');
const comparison = document.getElementById('comparison');
let examples = [];

const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));

function metric(example, key) {
  const value = example.metrics && example.metrics[key];
  return value == null ? '—' : typeof value === 'number' ? value.toFixed(1) + 's' : value;
}

function renderTabs() {
  list.replaceChildren();
  examples.forEach((example, index) => {
    const button = document.createElement('button');
    button.className = 'case-btn' + (index ? '' : ' active');
    button.textContent = example.title || 'Example ' + (index + 1);
    button.onclick = () => {
      document.querySelectorAll('.case-btn').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      renderComparison(example);
    };
    list.appendChild(button);
  });
  count.textContent = examples.length + ' case' + (examples.length === 1 ? '' : 's');
}

async function uploadMeshyScreenshot(example, file, status) {
  if (!file) return;
  if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
    status.textContent = 'Choose a PNG, JPG, or WEBP screenshot.';
    return;
  }

  status.textContent = 'Uploading Meshy screenshot…';
  const form = new FormData();
  form.append('image', file);

  try {
    const response = await fetch(API_BASE + '/examples/' + encodeURIComponent(example.id) + '/meshy-preview', {
      method: 'POST',
      body: form
    });
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.detail || response.statusText);
    }
    const payload = await response.json();
    example.meshy_image_url = payload.meshy_image_url;
    status.textContent = 'Saved. Updating comparison…';
    renderComparison(example);
  } catch (error) {
    console.error(error);
    status.textContent = 'Upload failed: ' + error.message;
  }
}

function renderComparison(example) {
  const hasModel = Boolean(example.meshy_model_url);
  const hasImage = Boolean(example.meshy_image_url);
  const sourceUrl = API_BASE + example.input_url;
  const systemUrl = API_BASE + (example.system_model_url || example.model_url);
  const meshyModelUrl = hasModel ? API_BASE + example.meshy_model_url : '';
  const meshyImageUrl = hasImage ? API_BASE + example.meshy_image_url : '';

  const meshyContent = hasImage
    ? '<img class="meshy-shot" src="' + esc(meshyImageUrl) + '?v=' + Date.now() + '" alt="Meshy AI output"><span class="hint">Meshy reference render</span>'
    : hasModel
      ? '<model-viewer src="' + esc(meshyModelUrl) + '" camera-controls auto-rotate shadow-intensity="1.2" exposure="1" tone-mapping="neutral" ar></model-viewer><span class="hint">Drag to orbit · scroll to zoom</span>'
      : '<div class="empty"><div><strong>Add Meshy screenshot</strong><label class="upload-btn">Upload screenshot<input id="meshy-file" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="upload-note">PNG, JPG, or WEBP. It will be stored with this example.</p><p id="upload-status" class="upload-status"></p></div></div>';

  comparison.className = 'compare';
  comparison.innerHTML =
    '<div class="pane"><div class="pane-head"><span>Input image</span><span class="tag">SOURCE</span></div><div class="input-wrap"><img src="' + esc(sourceUrl) + '" alt="Input image"></div></div>' +
    '<div class="pane"><div class="pane-head"><span>Meshy AI</span><span class="tag">' + (hasImage || hasModel ? 'MESHY OUTPUT' : 'ADD SCREENSHOT') + '</span></div><div class="model-wrap">' + meshyContent + '</div></div>' +
    '<div class="pane"><div class="pane-head"><span>Your system</span><span class="tag">TRELLIS OUTPUT</span></div><div class="model-wrap"><model-viewer src="' + esc(systemUrl) + '" camera-controls auto-rotate shadow-intensity="1.2" exposure="1" tone-mapping="neutral" ar></model-viewer><span class="hint">Drag to orbit · scroll to zoom</span></div></div>' +
    '<div class="details"><div><p class="title">' + esc(example.title || 'Generated example') + '</p><p class="sub">Input, Meshy AI render, and your TRELLIS model in one comparison.</p></div><div class="metrics"><span>Inference<b>' + metric(example, 'inference_time_sec') + '</b></span><span>Faces<b>' + ((example.metrics && example.metrics.mesh && example.metrics.mesh.face_count) || '—') + '</b></span><span>Status<b style="color:var(--green)">Ready</b></span></div></div>';

  const picker = document.getElementById('meshy-file');
  if (picker) {
    const status = document.getElementById('upload-status');
    picker.addEventListener('change', event => uploadMeshyScreenshot(example, event.target.files[0], status));
  }
}

async function loadExamples() {
  try {
    const response = await fetch(API_BASE + '/examples');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    examples = (await response.json()).examples || [];
    if (!examples.length) {
      count.textContent = '0 cases';
      comparison.innerHTML = '<strong>No examples yet</strong>Generate a model from the main page, then return here to compare it.';
      return;
    }
    renderTabs();
    renderComparison(examples[0]);
  } catch (error) {
    count.textContent = 'Unavailable';
    comparison.innerHTML = '<strong>Could not load examples</strong>Check that the backend is running, then refresh.';
    console.error(error);
  }
}
loadExamples();
</script>
</body>

</html>
